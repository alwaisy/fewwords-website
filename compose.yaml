services:
  web:
    image: ghcr.io/alwaisy/fewwords-website:latest
    container_name: fewwords-web
    restart: unless-stopped
    network_mode: host
    env_file: .env
    environment:
      - PORT=3000
    command: bun run .output/server/index.mjs

  worker:
    image: ghcr.io/alwaisy/fewwords-website:latest
    container_name: fewwords-worker
    restart: unless-stopped
    network_mode: host
    env_file: .env
    environment:
      - PORT=3001
    command: bun run .output/server/workers/index.mjs
