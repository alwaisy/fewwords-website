services:
  web:
    image: ghcr.io/alwaisy/fewwords-website:latest
    container_name: fewwords-web
    restart: unless-stopped
    network_mode: host
    env_file: .env
    # Using node for runtime stability with native modules
    command: node .output/server/index.mjs

  worker:
    image: ghcr.io/alwaisy/fewwords-website:latest
    container_name: fewwords-worker
    restart: unless-stopped
    network_mode: host
    env_file: .env
    # Using node for runtime stability with native modules
    command: node .output/server/workers/index.mjs
