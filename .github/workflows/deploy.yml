name: Deploy Fewwords to Production

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    # Export GitHub Secrets as environment variables during build
    # Required for nuxt.config.ts to access process.env.* at build time
    env:
      NUXT_SITE_URL: ${{ secrets.NUXT_SITE_URL }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      NUXT_SESSION_PASSWORD: ${{ secrets.NUXT_SESSION_PASSWORD }}
      JINA_AI_API_KEY: ${{ secrets.JINA_AI_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      YOUTUBE_DATA_API_KEY: ${{ secrets.YOUTUBE_DATA_API_KEY }}
      REDIS_URL: ${{ secrets.REDIS_URL }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
      RESEND_FROM_NAME: ${{ secrets.RESEND_FROM_NAME }}
      ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Setup Bun (package manager)
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Cache Bun dependencies
      - name: Cache Bun
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lockb') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      # Create .env file from GitHub secrets
      - name: Create .env file
        run: |
          echo "NODE_ENV=production" >> .env
          echo "NUXT_SITE_URL=${{ secrets.NUXT_SITE_URL }}" >> .env
          echo "DATABASE_URL=\"${{ secrets.DATABASE_URL }}\"" >> .env
          echo "NUXT_SESSION_PASSWORD=${{ secrets.NUXT_SESSION_PASSWORD }}" >> .env
          echo "JINA_AI_API_KEY=${{ secrets.JINA_AI_API_KEY }}" >> .env
          echo "OPENROUTER_API_KEY=${{ secrets.OPENROUTER_API_KEY }}" >> .env
          echo "OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}" >> .env
          echo "ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }}" >> .env
          echo "YOUTUBE_DATA_API_KEY=${{ secrets.YOUTUBE_DATA_API_KEY }}" >> .env
          echo "REDIS_URL=\"${{ secrets.REDIS_URL }}\"" >> .env
          echo "RESEND_API_KEY=${{ secrets.RESEND_API_KEY }}" >> .env
          echo "RESEND_FROM_EMAIL=${{ secrets.RESEND_FROM_EMAIL }}" >> .env
          echo "RESEND_FROM_NAME=${{ secrets.RESEND_FROM_NAME }}" >> .env
          echo "ADMIN_EMAIL=${{ secrets.ADMIN_EMAIL }}" >> .env

      # Install dependencies
      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Cache Nuxt build
      - name: Cache Nuxt build
        uses: actions/cache@v4
        with:
          path: |
            .nuxt
            .output
          key: ${{ runner.os }}-nuxt-${{ hashFiles('**/*.[jt]s', '**/*.vue') }}
          restore-keys: |
            ${{ runner.os }}-nuxt-

      # Build Nuxt application (builds to .output/)
      - name: Build Nuxt app
        run: bun run build

      # Create deployment package
      - name: Create deployment package
        run: |
          tar -czf deploy.tar.gz \
            --exclude=node_modules \
            --exclude=.git \
            --exclude=.github \
            --exclude=dev-docs \
            --exclude='*.log' \
            --exclude='.cache' \
            --exclude='.nuxt' \
            --exclude='.output' \
            --warning=no-file-changed \
            . 2>&1 | grep -v "file changed as we read it" || true

      # Add the built .output directory to the package
      - name: Add built output to package
        run: |
          tar -czf output.tar.gz .output/

      # Setup directories on VPS
      - name: Setup directories on VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT }}
          script: |
            mkdir -p ~/www/fewwords
            mkdir -p ~/www/fewwords/logs

      # Transfer source files
      - name: Transfer source files
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT }}
          source: "deploy.tar.gz"
          target: "~/www/fewwords"

      # Transfer built output
      - name: Transfer built output
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT }}
          source: "output.tar.gz"
          target: "~/www/fewwords"

      # Deploy on VPS
      - name: Deploy on VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT }}
          script: |
            # Load nvm
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"

            # Load bun
            export BUN_INSTALL="$HOME/.bun"
            export PATH="$BUN_INSTALL/bin:$PATH"

            cd ~/www/fewwords

            # Extract source files
            tar -xzf deploy.tar.gz
            rm deploy.tar.gz

            # Extract built output
            tar -xzf output.tar.gz
            rm output.tar.gz

            # Source .env file to load environment variables (must be AFTER extraction)
            set -a
            [ -f .env ] && . ./.env
            set +a

            # Install dependencies
            bun install --frozen-lockfile

            # Run database migrations
            bun run db:push

            # Cleanup: Stop fewwords PM2 processes by name
            pm2 stop fewwords-web fewwords-worker 2>/dev/null || true
            pm2 delete fewwords-web fewwords-worker 2>/dev/null || true

            # Cleanup: Kill any node processes on port 3000
            fuser -k 3000/tcp 2>/dev/null || true

            # Wait for port to be free
            sleep 2

            # Start PM2 fresh
            pm2 start ecosystem.config.cjs
            pm2 save

            echo "Deployment complete!"
