name: Deploy Fewwords (Docker)

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
           context: .
           push: true
           tags: ghcr.io/alwaisy/fewwords-website:latest
           build-args: |
            NUXT_SITE_URL=${{ secrets.NUXT_SITE_URL }}
            NUXT_PUBLIC_BASE_URL=${{ secrets.NUXT_PUBLIC_BASE_URL }}
            DATABASE_URL=${{ secrets.DATABASE_URL }}
            NUXT_SESSION_PASSWORD=${{ secrets.NUXT_SESSION_PASSWORD }}
            JINA_AI_API_KEY=${{ secrets.JINA_AI_API_KEY }}
            OPENROUTER_API_KEY=${{ secrets.OPENROUTER_API_KEY }}
            OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}
            ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }}
            YOUTUBE_DATA_API_KEY=${{ secrets.YOUTUBE_DATA_API_KEY }}
            REDIS_URL=${{ secrets.REDIS_URL }}
            RESEND_API_KEY=${{ secrets.RESEND_API_KEY }}
            RESEND_FROM_EMAIL=${{ secrets.RESEND_FROM_EMAIL }}
            RESEND_FROM_NAME=${{ secrets.RESEND_FROM_NAME }}
            ADMIN_EMAIL=${{ secrets.ADMIN_EMAIL }}
            NUXT_UMAMI_HOST=${{ secrets.NUXT_UMAMI_HOST }}
            NUXT_UMAMI_ID=${{ secrets.NUXT_UMAMI_ID }}

      - name: Create .env file for VPS
        run: |
           echo "NODE_ENV=production" >> .env
           echo "NUXT_SITE_URL=${{ secrets.NUXT_SITE_URL }}" >> .env
           echo "NUXT_PUBLIC_BASE_URL=${{ secrets.NUXT_PUBLIC_BASE_URL }}" >> .env
           echo "DATABASE_URL=${{ secrets.DATABASE_URL }}" >> .env
           echo "NUXT_SESSION_PASSWORD=${{ secrets.NUXT_SESSION_PASSWORD }}" >> .env
           echo "JINA_AI_API_KEY=${{ secrets.JINA_AI_API_KEY }}" >> .env
           echo "OPENROUTER_API_KEY=${{ secrets.OPENROUTER_API_KEY }}" >> .env
           echo "OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}" >> .env
           echo "ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }}" >> .env
           echo "YOUTUBE_DATA_API_KEY=${{ secrets.YOUTUBE_DATA_API_KEY }}" >> .env
           echo "REDIS_URL=${{ secrets.REDIS_URL }}" >> .env
           echo "RESEND_API_KEY=${{ secrets.RESEND_API_KEY }}" >> .env
           echo "RESEND_FROM_EMAIL=${{ secrets.RESEND_FROM_EMAIL }}" >> .env
           echo "RESEND_FROM_NAME=${{ secrets.RESEND_FROM_NAME }}" >> .env
           echo "ADMIN_EMAIL=${{ secrets.ADMIN_EMAIL }}" >> .env
           echo "NUXT_UMAMI_HOST=${{ secrets.NUXT_UMAMI_HOST }}" >> .env
           echo "NUXT_UMAMI_ID=${{ secrets.NUXT_UMAMI_ID }}" >> .env

      - name: Transfer deployment files to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT }}
          source: ".env,compose.yaml"
          target: "~/www/fewwords"

      - name: Deploy on VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT }}
          script: |
            cd ~/www/fewwords
            
            # Login to GHCR on VPS
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            
            # Pull latest image
            docker compose pull
            
            # Run migrations (using one-off container)
            docker compose run --rm web bun run db:push
            
            # Stop existing services gracefully
            docker compose down --remove-orphans || true
            
            # Start fresh containers
            docker compose up -d
            
            # Clean up old images to save disk space
            docker image prune -af
