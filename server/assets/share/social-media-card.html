<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fewwords Social Poster Generator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html-to-image/1.11.11/html-to-image.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap"
      rel="stylesheet"
    />

    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              background: "#f5f1e6",
              card: "#fffcf5",
              foreground: "#4a3f35",
              primary: "#a67c52",
              muted: "#ece5d8",
              mutedForeground: "#7d6b56",
              border: "#dbd0ba",
              darker: "#2e2620",
            },
            fontFamily: {
              serif: ['"Libre Baskerville"', "serif"],
              mono: ['"IBM Plex Mono"', "monospace"],
            },
          },
        },
      };
    </script>

    <style>
      body {
        margin: 0;
        background-color: #f5f1e6;
        color: #4a3f35;
      }
      #poster-canvas {
        width: 1080px;
        height: 1080px;
        flex-shrink: 0;
        transform-origin: top left;
      }
      .poster-card-shadow {
        box-shadow:
          0px 30px 60px -15px rgba(74, 63, 53, 0.12),
          0px 15px 35px -5px rgba(74, 63, 53, 0.05),
          inset 0px 0px 0px 1px rgba(255, 255, 255, 0.6);
      }
      .workspace-shadow {
        box-shadow: 0px 15px 50px rgba(0, 0, 0, 0.08);
      }
      ::-webkit-scrollbar {
        width: 6px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: #dbd0ba;
        border-radius: 10px;
      }
    </style>
  </head>
  <body class="flex h-screen font-sans overflow-hidden">
    <!-- Left Sidebar: Controls -->
    <aside class="w-80 bg-card border-r border-border p-6 flex flex-col h-full z-10 shrink-0 shadow-sm relative">
      <div class="mb-8">
        <h1 class="text-2xl font-serif text-foreground font-bold tracking-tight">Poster Generator</h1>
        <p class="text-sm text-mutedForeground mt-1 font-mono">1080x1080 social square</p>
      </div>

      <div class="space-y-6 flex-1 overflow-y-auto pr-2 pb-4">
        <div>
          <label class="block text-sm font-medium text-mutedForeground mb-2 uppercase tracking-wider text-[11px]">Logo URL</label>
          <input type="text" id="input-logo" class="w-full bg-white border border-border rounded-lg p-3 text-foreground focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-colors" value="http://localhost:3000/favicon-2048x2048.png" />
        </div>

        <div>
          <label class="block text-sm font-medium text-mutedForeground mb-2 uppercase tracking-wider text-[11px]">Title</label>
          <textarea id="input-title" rows="5" class="w-full bg-white border border-border rounded-lg p-3 text-foreground focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-colors resize-none leading-relaxed text-sm">How AI Is Changing Enterprise Software Development</textarea>
        </div>

        <div>
          <label class="block text-sm font-medium text-mutedForeground mb-2 uppercase tracking-wider text-[11px]">Metadata / Source</label>
          <input type="text" id="input-meta" class="w-full bg-white border border-border rounded-lg p-3 text-foreground focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-colors" value="adventures.nodeland.dev · Article" />
        </div>

        <div>
          <label class="block text-sm font-medium text-mutedForeground mb-2 uppercase tracking-wider text-[11px]">Summary URL</label>
          <input type="text" id="input-url" class="w-full bg-white border border-border rounded-lg p-3 text-foreground focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-colors font-mono text-sm" value="fewwords.app/app/few-F4n" />
        </div>
      </div>

      <div class="pt-5 border-t border-border mt-2 bg-card">
        <button id="download-btn" class="w-full bg-primary hover:bg-[#8d6e4c] text-white font-serif py-3.5 px-4 rounded-lg transition-all shadow-md hover:shadow-lg flex items-center justify-center gap-2">
          Download Poster
        </button>
      </div>
    </aside>

    <!-- Right Side: Live Preview -->
    <main class="flex-1 flex items-center justify-center bg-gradient-to-br from-[#ebe5d5] to-[#dcd2bb] overflow-hidden relative" id="preview-container">
      <div id="scale-wrapper" class="relative workspace-shadow">
        <div id="poster-canvas" class="bg-background relative p-8 flex flex-col justify-center items-center overflow-hidden">
          <div class="absolute inset-0 bg-[radial-gradient(circle_at_50%_50%,_rgba(166,124,82,0.06),_transparent_60%)] pointer-events-none"></div>

          <div class="bg-gradient-to-b from-[#fffcf5] to-[#fdfbf6] w-full h-full rounded-[2.5rem] poster-card-shadow border border-[#dbd0ba]/50 flex flex-col justify-between p-16 relative z-10">
            <!-- Top Section -->
            <div class="flex items-center gap-5">
              <img id="render-logo" src="http://localhost:3000/favicon-2048x2048.png" class="w-16 h-16 rounded-2xl object-cover shadow-sm border border-border/30" />
              <span class="text-primary font-sans text-[34px] font-bold tracking-tight">Fewwords</span>
            </div>

            <!-- Middle Section -->
            <div class="flex-1 flex flex-col justify-center py-10 mt-6">
              <div class="mb-8 flex">
                <div class="bg-muted/40 border border-border/40 rounded-full px-6 py-2.5">
                  <p id="render-meta" class="text-primary font-mono italic text-[26px] tracking-wide">adventures.nodeland.dev · Article</p>
                </div>
              </div>

              <h1 id="render-title" class="text-darker font-serif text-[84px] font-bold leading-[1.12] tracking-tight text-balance">How AI Is Changing Enterprise Software Development</h1>
            </div>

            <!-- Bottom Section -->
            <div class="flex items-center justify-center pt-8 pb-4">
              <p id="render-url" class="text-[#8d6e4c] font-mono text-[28px] font-semibold tracking-widest text-center">fewwords.app/app/few-F4n</p>
            </div>
          </div>
        </div>
      </div>
    </main>

    <script>
      const inputs = {
        logo: document.getElementById("input-logo"),
        title: document.getElementById("input-title"),
        meta: document.getElementById("input-meta"),
        url: document.getElementById("input-url")
      };

      const renders = {
        logo: document.getElementById("render-logo"),
        title: document.getElementById("render-title"),
        meta: document.getElementById("render-meta"),
        url: document.getElementById("render-url")
      };

      const defaultSvg = "http://localhost:3000/favicon-2048x2048.png";

      inputs.logo.addEventListener("input", (e) => renders.logo.src = e.target.value.trim() || defaultSvg);
      inputs.title.addEventListener("input", (e) => renders.title.textContent = e.target.value || "Title goes here...");
      inputs.meta.addEventListener("input", (e) => renders.meta.textContent = e.target.value || "Source / Type");
      inputs.url.addEventListener("input", (e) => {
        let val = e.target.value.trim().replace(/^https?:\/\//, "");
        renders.url.textContent = val || "fewwords.app/app/...";
      });

      function resizePreview() {
        const container = document.getElementById("preview-container");
        const wrapper = document.getElementById("scale-wrapper");
        const canvas = document.getElementById("poster-canvas");
        const scale = Math.min((container.clientWidth - 80) / 1080, (container.clientHeight - 80) / 1080, 1);
        canvas.style.transform = `scale(${scale})`;
        wrapper.style.width = `${1080 * scale}px`;
        wrapper.style.height = `${1080 * scale}px`;
      }

      window.addEventListener("resize", resizePreview);
      resizePreview();

      document.getElementById("download-btn").addEventListener("click", async () => {
        const node = document.getElementById("poster-canvas");
        const btn = document.getElementById("download-btn");
        try {
          btn.disabled = true;
          const dataUrl = await htmlToImage.toPng(node, { pixelRatio: 2, quality: 1, style: { transform: "scale(1)", transformOrigin: "top left" } });
          const link = document.createElement("a");
          link.download = `fewwords-poster-${Date.now()}.png`;
          link.href = dataUrl;
          link.click();
        } finally {
          btn.disabled = false;
        }
      });
    </script>
  </body>
</html>
